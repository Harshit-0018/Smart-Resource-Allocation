name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/sra-backend .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/sra-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sra-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/sra-backend \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars \
              FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }},\
              GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},\
              MAPS_API_KEY=${{ secrets.MAPS_API_KEY }},\
              TRANSLATE_API_KEY=${{ secrets.TRANSLATE_API_KEY }},\
              PIPELINE_SECRET=${{ secrets.PIPELINE_SECRET }}
